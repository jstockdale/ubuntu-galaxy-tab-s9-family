# cups-browsed waits for network-online.target, and multi-user.target waits
# for every unit it wants.  Stock, that holds the boot until NetworkManager
# has finished starting -- up to NM_ONLINE_TIMEOUT, 60 s, behind a slow DHCP
# -- and with it everything after multi-user.target, such as the speaker
# calibration.  Nothing else in the image wants network-online.target.
# Without default dependencies the target no longer orders itself after
# cups-browsed, which still starts at boot and still waits for the network;
# the lines below restore the rest of a service's defaults.
[Unit]
DefaultDependencies=no
Requires=sysinit.target
After=sysinit.target basic.target
Conflicts=shutdown.target
Before=shutdown.target
