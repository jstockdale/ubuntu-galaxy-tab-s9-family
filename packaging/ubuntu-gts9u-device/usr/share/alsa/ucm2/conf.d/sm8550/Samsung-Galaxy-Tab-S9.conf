Syntax 4

# UCM profile for the Galaxy Tab S9 11" (SM-X710).  Identical to the Ultra
# profile: same quad CS35L45 topology, same slots, same DSP bring-up.
#
# Unlike the SM8550 reference boards this tablet has no WSA/WCD codecs: the four
# Cirrus CS35L45 amplifiers hang off PRIMARY MI2S and the microphones are DMICs
# straight into the LPASS VA macro.  The routing therefore has nothing in common
# with the HDK profile and is spelled out here.

SectionUseCase."HiFi" {
	File "/Qualcomm/sm8550/GTS9U/HiFi.conf"
	Comment "HiFi quality Music."
}

BootSequence [
	# Per-amplifier hardware volume.  457 is 0 dB; 420 leaves about 9 dB of
	# headroom, which is loud enough for the tablet to be used comfortably
	# while keeping the parts away from full drive.  The Cirrus DSP
	# speaker-protection firmware is not loaded on this port, so nothing
	# limits excursion in hardware - upstream's own SM8550 machine driver
	# caps its speakers for exactly this reason.  Raise this only together
	# with working speaker protection.
	cset "name='Front Left Digital PCM Volume' 420"
	cset "name='Front Right Digital PCM Volume' 420"
	cset "name='Rear Left Digital PCM Volume' 420"
	cset "name='Rear Right Digital PCM Volume' 420"
	cset "name='Front Left Analog PCM Volume' 3"
	cset "name='Front Right Analog PCM Volume' 3"
	cset "name='Rear Left Analog PCM Volume' 3"
	cset "name='Rear Right Analog PCM Volume' 3"


	# DAC source defaults to the raw MI2S line (ASP_RX1): a safe bypass that
	# works even if the DSP never loads. HiFi.conf's Speaker EnableSequence
	# switches it to the DSP output once the cores are preloaded.
	cset "name='Front Left DACPCM Source' ASP_RX1"
	cset "name='Front Right DACPCM Source' ASP_RX2"
	cset "name='Rear Left DACPCM Source' ASP_RX1"
	cset "name='Rear Right DACPCM Source' ASP_RX2"
]

Include.card-init.File "/lib/card-init.conf"
