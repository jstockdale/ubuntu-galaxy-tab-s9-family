SectionVerb {
	EnableSequence [
		# Frontend -> backend: MultiMedia1 feeds PRIMARY_MI2S_RX, which is
		# where the four CS35L45 amplifiers listen.
		cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia1' 1"
		# Capture: the DMICs arrive through the VA macro, which has its
		# own LPASS DMA lane (VA_CODEC_DMA_TX_0).
		cset "name='MultiMedia3 Mixer VA_CODEC_DMA_TX_0' 1"
	]

	DisableSequence [
		cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia3 Mixer VA_CODEC_DMA_TX_0' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Built-in speakers (4x CS35L45)"

	EnableSequence [
		cset "name='Front Left AMP Enable Switch' 1"
		cset "name='Front Right AMP Enable Switch' 1"
		cset "name='Rear Left AMP Enable Switch' 1"
		cset "name='Rear Right AMP Enable Switch' 1"
		# Per-amplifier DSP configuration lives HERE, not in BootSequence:
		# this sequence runs on every card acquisition, so it survives
		# WirePlumber restarts and anything that rewrites mixer state,
		# where BootSequence runs once per boot and loses such races.
		# Right-side amplifiers take MI2S slot 1 (ASP_RX2): mainline does
		# not program per-amp serial slot mapping, so the mux picks the
		# channel.  RX3-RX8 feed the protection algorithm's power model.
		cset "name='Front Left DSP_RX1 Source' ASP_RX1"
		cset "name='Front Left DSP_RX2 Source' ASP_RX1"
		cset "name='Front Right DSP_RX1 Source' ASP_RX2"
		cset "name='Front Right DSP_RX2 Source' ASP_RX2"
		cset "name='Rear Left DSP_RX1 Source' ASP_RX1"
		cset "name='Rear Left DSP_RX2 Source' ASP_RX1"
		cset "name='Rear Right DSP_RX1 Source' ASP_RX2"
		cset "name='Rear Right DSP_RX2 Source' ASP_RX2"
		cset "name='Front Left DSP_RX3 Source' VMON"
		cset "name='Front Left DSP_RX4 Source' IMON"
		cset "name='Front Left DSP_RX5 Source' VDD_BATTMON"
		cset "name='Front Left DSP_RX6 Source' VDD_BSTMON"
		cset "name='Front Left DSP_RX7 Source' CLASSH_TGT"
		cset "name='Front Left DSP_RX8 Source' VDD_BATTMON"
		cset "name='Front Right DSP_RX3 Source' VMON"
		cset "name='Front Right DSP_RX4 Source' IMON"
		cset "name='Front Right DSP_RX5 Source' VDD_BATTMON"
		cset "name='Front Right DSP_RX6 Source' VDD_BSTMON"
		cset "name='Front Right DSP_RX7 Source' CLASSH_TGT"
		cset "name='Front Right DSP_RX8 Source' VDD_BATTMON"
		cset "name='Rear Left DSP_RX3 Source' VMON"
		cset "name='Rear Left DSP_RX4 Source' IMON"
		cset "name='Rear Left DSP_RX5 Source' VDD_BATTMON"
		cset "name='Rear Left DSP_RX6 Source' VDD_BSTMON"
		cset "name='Rear Left DSP_RX7 Source' CLASSH_TGT"
		cset "name='Rear Left DSP_RX8 Source' VDD_BATTMON"
		cset "name='Rear Right DSP_RX3 Source' VMON"
		cset "name='Rear Right DSP_RX4 Source' IMON"
		cset "name='Rear Right DSP_RX5 Source' VDD_BATTMON"
		cset "name='Rear Right DSP_RX6 Source' VDD_BSTMON"
		cset "name='Rear Right DSP_RX7 Source' CLASSH_TGT"
		cset "name='Rear Right DSP_RX8 Source' VDD_BATTMON"
		cset "name='Front Left DSP1 Preload Switch' 1"
		cset "name='Front Right DSP1 Preload Switch' 1"
		cset "name='Rear Left DSP1 Preload Switch' 1"
		cset "name='Rear Right DSP1 Preload Switch' 1"
		cset "name='Front Left DACPCM Source' DSP_TX1"
		cset "name='Front Right DACPCM Source' DSP_TX1"
		cset "name='Rear Left DACPCM Source' DSP_TX1"
		cset "name='Rear Right DACPCM Source' DSP_TX1"
	]

	DisableSequence [
		cset "name='Front Left AMP Enable Switch' 0"
		cset "name='Front Right AMP Enable Switch' 0"
		cset "name='Rear Left AMP Enable Switch' 0"
		cset "name='Rear Right AMP Enable Switch' 0"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		# MultiMedia1 Playback
		PlaybackPCM "hw:${CardId},0"
		#
		# Deliberately no PlaybackMixer/PlaybackMixerElem.
		#
		# Volume lives in four independent per-amplifier controls with no
		# single master, so there is nothing sensible to hand the sound
		# server: given a mixer it flags the sink HARDWARE, stops applying
		# software attenuation, and writes to a control that does not move
		# the output - the desktop slider then does nothing.  Without one
		# it attenuates in software, which works and keeps all four
		# amplifiers in step.  The hardware volumes are pinned near maximum
		# in the card's BootSequence so that full-scale really is full.
	}
}

SectionDevice."Mic" {
	Comment "Built-in digital microphones"

	# Which DMIC line feeds each capture channel is board wiring, so the card
	# file may name it (Samsung-Galaxy-Tab-S9.conf does).  A card file that
	# does not keeps the DMIC0/DMIC1 pair this profile has always recorded.
	If.mic_channel0 {
		Condition {
			Type String
			Empty "${var:-MicChannel0Dmic}"
		}
		True.Define.MicChannel0Dmic "DMIC0"
	}
	If.mic_channel1 {
		Condition {
			Type String
			Empty "${var:-MicChannel1Dmic}"
		}
		True.Define.MicChannel1Dmic "DMIC1"
	}

	EnableSequence [
		# Two DMIC lines -> decimators 0/1 -> VA AIF1 capture.
		cset "name='VA DMIC MUX0' ${var:MicChannel0Dmic}"
		cset "name='VA DMIC MUX1' ${var:MicChannel1Dmic}"
		cset "name='VA DEC0 MUX' VA_DMIC"
		cset "name='VA DEC1 MUX' VA_DMIC"
		cset "name='VA_AIF1_CAP Mixer DEC0' 1"
		cset "name='VA_AIF1_CAP Mixer DEC1' 1"
		cset "name='VA_DEC0 Volume' 80%"
		cset "name='VA_DEC1 Volume' 80%"
	]

	DisableSequence [
		cset "name='VA_AIF1_CAP Mixer DEC0' 0"
		cset "name='VA_AIF1_CAP Mixer DEC1' 0"
		cset "name='VA DMIC MUX0' ZERO"
		cset "name='VA DMIC MUX1' ZERO"
	]

	Value {
		CaptureChannels 2
		CapturePriority 100
		# MultiMedia3 Capture
		CapturePCM "hw:${CardId},2"
		# Software volume here too: the VA decimator gains are per-channel
		# and there is no master capture control to expose.
	}
}
