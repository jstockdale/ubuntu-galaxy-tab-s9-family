# Installed into the GDM greeter's own ~/.config by ubuntu-gts9u-device
# (/usr/libexec/ubuntu-gts9u-greeter-audio); never loaded for anyone else.
#
# The same as bluetooth.lua.d/51-gts9u-greeter-no-bluez.lua, for WirePlumber
# 0.5 (Ubuntu 26.04), which ignores the Lua file just as 0.4 ignores this one.
# Untested on 0.5 so far.
wireplumber.profiles = {
  main = {
    monitor.bluez = disabled
    monitor.bluez-midi = disabled
  }
}
