# Installed by the SM-X710 hang-log kit (tools/inplace/hang-log);
# its rollback.sh removes it.
#
# ABL appends "nowatchdog" to the kernel command line, which turns the soft-
# and hard-lockup detectors off at boot.  They only print ("BUG: soft
# lockup", "Watchdog detected hard LOCKUP"); this kernel never panics on them.
kernel.watchdog = 1
# The console loglevel stays at Ubuntu's 4 (10-console-messages.conf).  Each
# line the consoles print costs 0.1 to 0.25 s here, with interrupts off: the
# three err lines of a hung-task report came 231, 108 and 243 ms apart on
# 2026-11-10.  A panic still writes the log's tail to pstore whatever the
# loglevel.
