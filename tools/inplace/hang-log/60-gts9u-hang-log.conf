# Installed by the SM-X710 hang-log kit (tools/inplace/hang-log);
# its rollback.sh removes it.
#
# ABL appends "nowatchdog" to the kernel command line, which turns the soft-
# and hard-lockup detectors off at boot.  They only print ("BUG: soft
# lockup", "Watchdog detected hard LOCKUP"); this kernel never panics on them.
kernel.watchdog = 1
# Warnings reach the consoles too, ramoops' among them, so the next boot keeps
# a WARN's backtrace.  10-console-messages.conf stops at errors, and the 00:19
# hang's record lost the WARN that came with "Error sending AMC RPMH
# requests".  The cost is the debug UART at 115200: on 2026-11-09 the busiest
# minute had 16 warning lines.
kernel.printk = 5 4 1 7
