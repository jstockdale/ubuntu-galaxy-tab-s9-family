# Persistent journal for the Galaxy Tab S9 family.  The panel can stay dark
# long before a display manager starts, so the journal is the primary
# diagnostic channel, and bring-up kernels log a lot (loglevel=7, dyndbg).
#
# 1G instead of the 256M that images used to set in
# /etc/systemd/journald.conf.d/10-gts9uwifi-persistent.conf: at that cap the
# directory sat permanently full, so every rotation vacuumed a file.  Drop-ins
# from all directories are applied in file-name order, so this file overrides
# that one; put a local value in a later name, for example
# /etc/systemd/journald.conf.d/90-local.conf.
#
# The cap was not what lost the first ~39 s of every boot; the clock was (see
# ubuntu-gts9u-rtc-restore.service).  The cap only decided how soon it hit.
[Journal]
Storage=persistent
SystemMaxUse=1G
