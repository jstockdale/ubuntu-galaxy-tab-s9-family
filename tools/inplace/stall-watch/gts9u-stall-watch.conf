# gts9u stall-watch settings.  Every line is optional; the values shown are the
# defaults.  After a change: sudo systemctl restart gts9u-stall-watch
#
# interval_ms = 1000          sampling period
# proc_scan_every = 5         process scan every N samples (every sample during a stall)
# pre_s = 120                 seconds kept from before an incident
# post_s = 30                 quiet seconds that close an incident
# max_incident_s = 600        longer incidents are split
# ring_flush_s = 60           disk write cadence for the ring (10 s during an incident)
# ring_max_mb = 64            disk cap for the continuous ring
# incidents_max_mb = 64       disk cap for incident records
# incidents_max_count = 200
# incidents_per_hour = 20     beyond this only a summary is kept
# min_free_mb = 512           stop writing below this much free space
# late_ms = 200               sampler lateness that counts as a stall
# late_incident_ms = 500
# mem_full_ms = 100           PSI memory "full" per second that counts as stalled
# mem_incident_ms = 500       memory "full" over an episode that makes an incident
# io_full_ms = 200
# io_incident_ms = 1000
# cpu_some_ms = 950           PSI cpu "some" per second ...
# cpu_sustain_s = 5           ... for this many seconds in a row
# desktop_ms = 100            compositor memory+I/O stall per second
# desktop_incident_ms = 300
# desktop_wait_ms = 300       compositor main-thread run-queue wait per second
# psi_trigger_memory = some 150000 1000000
# psi_trigger_io = full 150000 1000000
# psi_trigger_cpu =
# journal_markers = 1         one journal line per saved incident
# mlock = 1
# max_rss_mb = 128
